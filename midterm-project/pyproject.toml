[project]
name = "midterm-project"
version = "0.1.0"
description = "Solar energy generation prediction (ML Zoomcamp midterm project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
