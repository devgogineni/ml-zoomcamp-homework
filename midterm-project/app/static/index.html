<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar energy generation predictor</title>
  <style>
    :root { --accent: #d97706; --border: #d4d4d8; --muted: #52525b; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafaf9; color: #18181b; }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin-top: 0; }
    p.intro { color: var(--muted); }
    form { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
    fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; }
    legend { font-weight: 600; margin-bottom: .5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem; }
    label { display: block; font-size: .9rem; color: var(--muted); }
    input[type=number], input[type=date], select {
      width: 100%; padding: .45rem; margin-top: .2rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 4px; background: #fff;
    }
    .checks { display: flex; gap: 1.5rem; }
    .checks label { display: flex; align-items: center; gap: .4rem; color: inherit; font-size: 1rem; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: .7rem 1.4rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #result { margin-top: 1.25rem; padding: 1rem; border-radius: 8px; display: none; }
    #result.ok { display: block; background: #fffbeb; border: 1px solid var(--accent); }
    #result.error { display: block; background: #fef2f2; border: 1px solid #dc2626; color: #991b1b; }
    #result .value { font-size: 2rem; font-weight: 700; }
    ul { margin: .25rem 0 0; padding-left: 1.2rem; }
  </style>
</head>
<body>
<main>
  <h1>Solar energy generation predictor</h1>
  <p class="intro">Enter the day's weather to predict the solar energy generated.</p>

  <form id="form">
    <fieldset>
      <legend>Date</legend>
      <label>Date (only the day of the year is used)
        <input type="date" name="date" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>Weather</legend>
      <div class="grid" id="fields"></div>
    </fieldset>

    <fieldset>
      <legend>Conditions</legend>
      <div class="grid">
        <label>Sky
          <select name="sky" id="sky" required></select>
        </label>
      </div>
      <div class="checks" id="precipitation" style="margin-top:.75rem"></div>
    </fieldset>

    <button type="submit" id="submit">Predict</button>
  </form>

  <div id="result" role="status"></div>
</main>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");
const submit = document.getElementById("submit");
let numericFields = [];

function showError(html) {
  result.className = "error";
  result.innerHTML = html;
}

async function init() {
  const meta = await (await fetch("/api/features")).json();
  numericFields = meta.fields;

  document.getElementById("fields").innerHTML = meta.fields.map(f => `
    <label>${f.label} (${f.unit})
      <input type="number" name="${f.name}" required
             min="${f.min}" max="${f.max}" step="${f.step}" value="${f.default}">
    </label>`).join("");

  document.getElementById("sky").innerHTML =
    meta.sky.map(o => `<option value="${o.value}">${o.label}</option>`).join("");

  document.getElementById("precipitation").innerHTML = meta.precipitation.map(o => `
    <label><input type="checkbox" name="precipitation" value="${o.value}"> ${o.label}</label>`).join("");

  form.elements.date.value = new Date().toISOString().slice(0, 10);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = new FormData(form);
  const payload = {
    date: data.get("date"),
    sky: data.get("sky"),
    precipitation: data.getAll("precipitation"),
  };
  numericFields.forEach(f => { payload[f.name] = parseFloat(data.get(f.name)); });

  submit.disabled = true;
  try {
    const response = await fetch("/api/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await response.json();
    if (response.ok) {
      result.className = "ok";
      result.innerHTML = `Predicted solar energy generated<div class="value">${body.solar_energy_generated} kW</div>`;
    } else if (response.status === 422) {
      const items = body.detail.map(d => `<li>${d.loc.slice(1).join(".") || "input"}: ${d.msg}</li>`).join("");
      showError(`Please fix the input:<ul>${items}</ul>`);
    } else {
      showError("The server could not make a prediction.");
    }
  } catch (err) {
    showError("Could not reach the server.");
  } finally {
    submit.disabled = false;
  }
});

init().catch(() => showError("Could not load the form definition from the server."));
</script>
</body>
</html>
